  - id: NEXT-119
    priority: P0
    phase: METHOD-VALIDATION
    title: Methodenkern v0.4 an Referenzvarianten validieren und Screeningkern kalibrieren
    owner_role: methodologist
    status: blocked
    blocked_by: [NEXT-120]
    github_issue: 67
    inputs:
      - docs/method/METHOD_CORE_V0_4_DE.md
      - docs/method/GLOSSARY_DE.md
      - docs/method/GLOSSARY_DE_V0_4_ADDENDUM.md
      - docs/architecture/INTAKE_AND_CONTEXT_SOURCES.md
      - data/method/question_bank/
    reference_variants:
      - bestehendes On-Prem
      - US-Hyperscaler in EU-Region
      - deutscher/europaeischer Provider
      - optional hypothetische Soll-Architektur
    outputs:
      - validated decision flow
      - 15-25 core screening questions
      - adaptive deep-dive triggers
      - framework-overlay activation rules
      - status-quo/opportunity comparison
      - recommendation-template findings
    exit_criteria:
      - Derselbe Workload kann nachvollziehbar über mindestens drei sehr unterschiedliche Varianten verglichen werden.
      - Das Screening bleibt im Zielkorridor von etwa 15-25 Fragen oder Abweichungen sind fachlich begründet.
      - Mindestens ein geopolitischer Sorge-Satz wird in prüfbare Szenarien übersetzt und providerneutral angewendet.
      - BSI-/C3A-/Compliance-Deep-Dives werden nur bei Bedarf aktiviert.
      - Business-/Innovationsnutzen und Status-quo-Risiken sind sichtbar, ohne Hard Gates zu kompensieren.
      - Evidence Gaps und Unsicherheit bleiben getrennt von Risikoeinstufung sichtbar.

