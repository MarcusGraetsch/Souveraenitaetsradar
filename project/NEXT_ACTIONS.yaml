    owner_role: cloud-security-engineer
    status: ready
    inputs:
      - AWS CLI v2 Profile mit Read-Rechten
      - Region
      - Bedrock Agent ID
      - Model ID
      - Inference Profile ID sofern verwendet
    outputs:
      - _manifest.jsonl
      - _errors.jsonl
      - normalized_evidence.json
      - technical_findings.json
