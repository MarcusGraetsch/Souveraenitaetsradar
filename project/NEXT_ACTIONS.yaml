      - Keine C3A-Lücke wird still durch Annahmen geschlossen.
      - Notwendige Änderungen sind umgesetzt oder als Folge-Issues erfasst.
      - NEXT-118 und NEXT-119 sind anschließend explizit freigegeben oder angepasst.
    next_primary_candidate: true

