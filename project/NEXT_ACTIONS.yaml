priorities:
  - id: NEXT-118
    priority: P0
    phase: MVP-VALIDATION
    title: Erste manuelle Consultant-Installation und Evaluation durchführen
    owner_role: evidence-analyst
    status: planned
    github_issue: 28
    depends_on: [NEXT-101, NEXT-113, NEXT-115]
    human_in_the_loop:
      required: true
      gates: [HITL-01, HITL-08]
      human_roles:
        - Product Owner
        - Test-Consultant
      decision_required: >-
        Die Anwendung muss von einem Menschen auf einem frischen Zielsystem selbst
        installiert und aus Consultant-Sicht bewertet werden; synthetische CI-Tests
        ersetzen diese Freigabe nicht.
    inputs:
      - docs/validation/FIRST_INSTALL_EVALUATION.md
      - docs/method/METHOD_CORE_V0_4_DE.md
      - docs/method/C3A_V1_0_REVIEW.md
    outputs:
      - manual install result
      - consultant UX findings
      - method findings
      - v0.4 UI-gap findings
      - follow-up issues/decisions
    exit_criteria:
      - Installation und Runtime-Tests auf einem frischen Zielsystem sind dokumentiert.
      - UX- und Methodenlücken der pre-v0.4-Runtime sind erfasst.
      - Eine menschliche Product-Owner-/Consultant-Bewertung ist dokumentiert.
      - Keine C3A-Konformitätsaussage wird aus dem bisherigen Runtime-Scoring abgeleitet.
    next_primary_candidate: true

  - id: NEXT-119
    priority: P0
    phase: METHOD-VALIDATION
    title: Methodenkern v0.4 an Referenzvarianten validieren und Screeningkern kalibrieren
    owner_role: methodologist
    status: planned
    github_issue: 67
    human_in_the_loop:
      required: true
      gates: [HITL-01, HITL-02, HITL-05, HITL-06, HITL-08]
      human_roles:
        - Method Owner / Lead Consultant
        - Product Owner
      decision_required: >-
        Referenzfall und Varianten, Requirement Profile/Hard Gates, Screeningkern,
        Deep-Dive-Aktivierung, Plausibilität der Variantenbewertung und die Freigabe
        zur späteren Runtime-Migration müssen menschlich bestätigt werden.
    inputs:
      - docs/method/METHOD_CORE_V0_4_DE.md
      - docs/method/GLOSSARY_DE.md
      - docs/method/C3A_V1_0_REVIEW.md
      - data/method/c3a_v1_0_crosswalk.csv
      - docs/architecture/INTAKE_AND_CONTEXT_SOURCES.md
      - data/method/question_bank/
    reference_variants:
      - bestehendes On-Prem
      - US-Hyperscaler in EU-Region
      - deutscher/europaeischer Provider
      - optional hypothetische Soll-Architektur
    outputs:
      - validated decision flow
      - 15-25 core screening questions
      - adaptive deep-dive triggers
      - framework-overlay activation rules
      - C3A requirement-profile activation rules
      - status-quo/opportunity comparison
      - recommendation-template findings
    exit_criteria:
      - Derselbe Workload kann nachvollziehbar über mindestens drei sehr unterschiedliche Varianten verglichen werden.
      - Das Screening bleibt im Zielkorridor von etwa 15-25 Fragen oder Abweichungen sind fachlich begründet.
      - Mindestens ein geopolitischer Sorge-Satz wird in prüfbare Szenarien übersetzt und providerneutral angewendet.
      - BSI-/C3A-/Compliance-Deep-Dives werden nur bei Bedarf aktiviert.
      - Business-/Innovationsnutzen und Status-quo-Risiken sind sichtbar, ohne Hard Gates zu kompensieren.
      - Evidence Gaps und Unsicherheit bleiben getrennt von Risikoeinstufung sichtbar.
      - C3A Criteria/Additional Criteria werden als Anforderungen und nicht als Reifegradleiter behandelt.
      - Die menschlichen Freigaben für Plausibilität und Runtime-Migration sind dokumentiert.

