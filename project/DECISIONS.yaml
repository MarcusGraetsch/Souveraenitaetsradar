version: 1
updated: "2026-09-03"
decisions:
  - id: DEC-001
    status: accepted
    title: Security und Souveränität bleiben getrennte Bewertungsachsen
    rationale: Eine souveränere Lösung kann anfangs unsicherer sein; eine stark gemanagte Lösung kann sicherer und zugleich abhängiger sein.
    source: INT-01

  - id: DEC-002
    status: accepted
    title: Gate first, score second
    rationale: Mindestanforderungen dürfen nicht durch andere gute Eigenschaften kompensiert werden.
    sources: [SRC-24, INT-01]

  - id: DEC-003
    status: accepted
    title: Radar Capability Level 0-4 ist kein offizieller EU-SEAL
    rationale: Eigene Operationalisierung darf nicht als offizielles Framework-Ergebnis ausgegeben werden.
    sources: [SRC-24, INT-01]

  - id: DEC-004
    status: accepted
    title: Provider Capability und Applied Capability werden getrennt gespeichert
    rationale: Das Vorhandensein einer Funktion belegt nicht ihre Nutzung oder Wirksamkeit im konkreten Workload.
    source: INT-01

  - id: DEC-005
    status: accepted
    title: Evidence Confidence ist keine Risikohöhe
    rationale: Fehlende Evidence erzeugt Unsicherheit/Evidence Hold, nicht automatisch höheres technisches Risiko.
    sources: [SRC-07, SRC-24, INT-01]

  - id: DEC-006
    status: accepted
    title: Fehlende Evidence führt zu UNVERIFIED
    rationale: Dreiwertige Logik verhindert erfundene PASS/FAIL-Aussagen.
    source: INT-01

  - id: DEC-007
    status: accepted
    title: Lock-in wird primär als strukturelle Exposition modelliert
    rationale: Die Abhängigkeit besteht bereits; ein späterer Trigger aktiviert ihre Auswirkung.
    sources: [SRC-08, SRC-12, INT-01]

  - id: DEC-008
    status: accepted
    title: Exit-Transition und Cutover-Downtime werden getrennt bewertet
    rationale: Eine Migration kann lange dauern, ohne dass der Dienst entsprechend lange ausfällt.
    sources: [SRC-08, SRC-12, SRC-20, INT-01]

  - id: DEC-009
    status: accepted
    title: R6 Evidence Collector bleibt read-only und payload-frei
    rationale: Konfigurations-Evidence soll ohne Produktionsänderung und ohne Fachdatenzugriff erhoben werden.
    sources: [SRC-47, SRC-48, SRC-49, SRC-50, SRC-51, SRC-52, SRC-53, SRC-54, INT-01]

  - id: DEC-010
    status: accepted
    title: Raw kunden-/accountbezogene Evidence wird standardmäßig nicht committed
    rationale: IAM-, ARN-, Netzwerk- und Vertragsinformationen können sensitiv sein.
    source: INT-01
