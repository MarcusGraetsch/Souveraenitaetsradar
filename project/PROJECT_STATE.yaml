  web_app: apps/web/
  api_app: apps/api/
  gate_api: apps/api/app/gate_api.py
  compose: docker-compose.yml
  applicability_engine: src/sovradar/applicability.py
  gate_catalog_engine: src/sovradar/gate_catalog.py
  gate_evaluation_engine: src/sovradar/gate_evaluation.py
  evidence_intake: src/sovradar/intake.py
  workbook_manifest: artifacts/method/METHOD_WORKBOOK_MANIFEST.md
  question_bank: data/method/question_bank/
  risk_taxonomy: data/method/risk_taxonomy.csv
  source_register: data/method/source_register.csv
  hard_gates: data/method/r4_hard_gates.csv
  factor_rules: data/method/r4_factor_rules.csv
  evidence_request_catalog: data/method/evidence_request_catalog.csv
  evidence_pack_schema: schemas/evidence-pack.schema.json

quality_gates:
  provenance_required: true
  pr_review_for_substantial_changes: true
  deterministic_rule_tests_required: true
  raw_customer_evidence_in_repo: false
  automatic_risk_acceptance_allowed: false
  customer_cloud_credentials_required: false
  llm_api_required_for_mvp: false
  uninstall_removes_generated_data: true
  unknown_applicability_may_be_hidden: false
  llm_proposal_may_change_gate_without_human_review: false
  gate_requirement_defaults_are_regulatory_requirements: false

blockers: []

open_method_questions:
  - id: OMQ-001
    text: Default-Requirement-Templates und interne Schwellen müssen mit mehreren Beratern/Kundenfällen kalibriert werden.
  - id: OMQ-002
    text: Inter-Rater-Konsistenz der Fragen-/Gate-Bewertung ist noch nicht empirisch gemessen.
  - id: OMQ-003
    text: C5:2026 Detailmapping und weitere Framework-Versionen müssen weiter verfeinert werden.
  - id: OMQ-004
    text: Noch nicht deterministisch operationalisierte natürliche Anwendbarkeitsregeln bleiben needs_review und müssen schrittweise strukturiert werden.
  - id: OMQ-005
    text: Die interne Aggregation mehrerer Capability-Claims pro Gate muss im späteren Inter-Rater-/Kundenpilot kalibriert werden.

next_milestone:
  id: NEXT-114
  name: synthetic-consultant-walkthrough
  github_issue: 18
  exit_criteria:
    - Clean clone/install/test workflow wird praktisch durchlaufen.
    - Ein synthetisches Assessment wird ohne Excel-Bedienung von Scope bis Hard Gates abgeschlossen.
    - Mindestens ein PASS, ein FAIL und ein UNVERIFIED werden gezielt demonstriert.
    - LLM Bridge wird ohne automatische Entscheidungsübernahme getestet.
    - UX- und Methodikprobleme werden als eigene Issues dokumentiert.
    - Stop/Start und vollständige Deinstallation werden validiert.
