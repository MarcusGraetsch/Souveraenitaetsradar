current_truth:
  - Der Souveränitäts-Radar ist primär Decision Support für mehrere Betriebs-/Architekturvarianten eines konkreten Workloads und kein universelles Compliance-Audit.
  - Der Methodenkern ist cloud-agnostisch; Provider-spezifische Logik gehört in Research-/Evidence-/Adapter-Layer.
  - Die finale Empfehlung darf vom Radar bzw. Beratungsteam formuliert werden; finale Entscheidung, Risikoakzeptanz und rechtliche Würdigung bleiben beim Kunden.
  - Die sichtbare Managementsicht nutzt sieben Entscheidungsdimensionen: Geschäft & Innovation, Security & Resilienz, Recht/Daten/Kontrolle, Technologie & Exit, Organisation & Skills, Lieferkette & Geopolitik sowie Wirtschaft & Vertrag.
  - Evidence Confidence bleibt separat von Risiko, Capability und Business Value.
  - BSI 200-3 ist Anschluss-, Deep-Dive- und Vollständigkeitsreferenz; die 47 elementaren Gefährdungen sind kein verpflichtender sichtbarer Interviewkatalog.
  - Bitkom Cloud-Souveränität 2026 ist zentrale Orientierungsquelle für Handlungsfähigkeit, Risiko/Chance, Skills, Interdependenzen und Exit.
  - EU Cloud Sovereignty Framework und BSI C3A bilden primär den Provider-/Service-Souveränitätslayer; das vollständige C3A-Detailmapping ist noch nicht freigegeben.
  - Data Act wird als Exit-/Switching-/Portabilitätsreferenz genutzt, soweit anwendbar.
  - NIS2, DORA, DSGVO/EDPB, AI Act und andere Vorgaben werden nur bei tatsächlicher Anwendbarkeit als Compliance-Overlay aktiviert; sonst können sie Methoden-/Fragenquelle sein.
  - Die Question Bank ist eine adaptive Question Library, kein Pflichtfragebogen; Zielkorridor für das sichtbare Kernscreening sind etwa 15–25 Fragen und muss validiert werden.
  - Eine realistische Status-quo-/Nichtstun-Variante wird bei Migrations-/Modernisierungsentscheidungen mitbetrachtet; Business-/Innovationsnutzen und Risiko des Nichtstuns sind expliziter Entscheidungsinput.
  - Vorhandene Kundenartefakte und Interviews bilden einen kombinierten optionalen Intake; ArchiMate, CMDB, IaC oder andere strukturierte Quellen sind hilfreich, aber keine Voraussetzung.
  - Politische/geopolitische Sorgen werden in konkrete prüfbare Szenarien übersetzt; Providerherkunft oder Staatenzugehörigkeit erzeugen keinen pauschalen Score.
  - Provider/Service Capability ist nicht Applied Capability.
  - Fehlende Evidence führt zu UNVERIFIED/EVIDENCE HOLD, nicht automatisch zu FAIL.
  - Gate first, score second; nicht kompensierbare Mindestanforderungen dürfen nicht durch andere Stärken ausgeglichen werden.
  - Human-reviewed Claims sind die einzige Brücke von Evidence zur deterministischen Gate-Bewertung.
  - Customer-mediated Evidence ist Standard; direkter Cloud-Account-, Root-, Owner- oder Credential-Zugang ist keine Voraussetzung.
  - Raw Kundenevidence wird nicht in Git committed.

runtime_truth:
  - Die lokal installierbare React/FastAPI/PostgreSQL-Webanwendung ist vorhanden und technisch validiert.
  - Die Runtime implementiert noch wesentliche Teile des früheren Einzel-Assessment-/128-Fragen-Workflows und ist deshalb nicht vollständig identisch mit dem fachlichen Zielmodell v0.4.
  - Applicability nutzt applicable, not_applicable und needs_review; Unklarheit wird nicht still ausgeblendet.
  - Workflow-Staging nutzt screening, clarification, deep_dive, completed und excluded; Staging ersetzt nicht Applicability.
  - LLM-Proposals verändern ohne Human Review weder Claims noch Hard Gates.
  - Structured Export, Consultant Report, Backup und Restore sind implementiert; Standardexport/Report enthalten keine Raw Evidence.
  - Öffentliche Provider-Dokumentation mit applied_state=available wird nicht zu configured Applied Capability hochgestuft.
  - Der frühere direkte AWS-Collector ist als Standardansatz verworfen und nur historisch dokumentiert.

