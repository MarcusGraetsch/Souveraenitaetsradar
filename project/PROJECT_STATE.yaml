project:
  name: Souveraenitaetsradar
  repository: MarcusGraetsch/Souveraenitaetsradar
  status: active
  current_phase: MVP-01
  current_phase_name: consultant-web-application
  method_version: "1.0"
  product_version: "0.2.0-dev"
  updated: "2026-09-03"

purpose:
  statement: >-
    Entwicklung einer belastbaren, nachvollziehbaren und später KI-gestützten
    Methode sowie eines praktisch nutzbaren Beratungswerkzeugs zur Bewertung
    digitaler Souveränitätsrisiken von Cloud-, Plattform-, SaaS- und KI-Lösungen.

current_truth:
  - Der Methodenkern ist cloud-agnostisch; Provider-spezifische Logik ist Adapter-/Research-Layer.
  - Direkter Cloud-Account-, Root-, Owner- oder Credential-Zugang ist keine Voraussetzung des Beratungsprodukts.
  - "Standard ist Customer-mediated Evidence: Kunde liefert Dokumente, Exporte, Screenshare-Beobachtungen oder Testergebnisse."
  - BSI-200-3-basierte Risikoanalyse bleibt Prozess-/Risikokern und wird um souveränitätsspezifische Risikotypen ergänzt.
  - Security Capability, Sovereignty Capability, Workload Sovereignty Risk und Evidence Confidence bleiben getrennt.
  - Nicht kompensierbare Mindestanforderungen werden vor gewichteten Vergleichswerten geprüft.
  - Provider/Service Capability wird von Applied Capability getrennt.
  - Fehlende Evidence führt zu UNVERIFIED/EVIDENCE HOLD, nicht zu erfundenem PASS/FAIL.
  - Die Excel-Datei ist Methoden-/Entwicklungsreferenz, nicht mehr primäre Consultant-UI.
  - MVP-01 ist eine lokal installierbare React/FastAPI/PostgreSQL-Webanwendung.
  - Dokumente liegen im MVP lokal unter .runtime; Object Storage folgt später.
  - KI-Unterstützung im MVP erfolgt über eine Copy/Paste LLM Bridge ohne API-Key oder Providerbindung.
  - Der Consultant-Fragenpfad wird deterministisch aus Assessment-Scope und einem separaten Relevanzprofil abgeleitet.
  - Question Applicability nutzt applicable, not_applicable und needs_review; Unklarheit blendet keine Frage still aus.
  - Die LLM Bridge erhält nur relevante bzw. zu prüfende offene Fragen, entscheidet aber nicht über Applicability.
  - NEXT-111 Guided Workflow ist implementiert und in PR-CI inklusive Compose-Smoke-Test validiert.
  - R5 Amazon-Bedrock-Public-Evidence bleibt Provider-Beispiel und methodischer Lernfall, nicht Zielarchitektur.
  - Der frühere direkte AWS-Collector ist als Standardansatz verworfen und nur historisch dokumentiert.

primary_artifacts:
  product_mvp: docs/product/MVP_01_CONSULTANT_WEBAPP.md
  web_app: apps/web/
  api_app: apps/api/
  compose: docker-compose.yml
  applicability_engine: src/sovradar/applicability.py
  workbook_manifest: artifacts/method/METHOD_WORKBOOK_MANIFEST.md
  question_bank: data/method/question_bank/
  risk_taxonomy: data/method/risk_taxonomy.csv
  source_register: data/method/source_register.csv
  hard_gates: data/method/r4_hard_gates.csv
  factor_rules: data/method/r4_factor_rules.csv
  evidence_request_catalog: data/method/evidence_request_catalog.csv
  evidence_pack_schema: schemas/evidence-pack.schema.json

quality_gates:
  provenance_required: true
  pr_review_for_substantial_changes: true
  deterministic_rule_tests_required: true
  raw_customer_evidence_in_repo: false
  automatic_risk_acceptance_allowed: false
  customer_cloud_credentials_required: false
  llm_api_required_for_mvp: false
  uninstall_removes_generated_data: true
  unknown_applicability_may_be_hidden: false

blockers: []

open_method_questions:
  - id: OMQ-001
    text: Default-Requirement-Templates und interne Schwellen müssen mit mehreren Beratern/Kundenfällen kalibriert werden.
  - id: OMQ-002
    text: Inter-Rater-Konsistenz der Fragen-/Gate-Bewertung ist noch nicht empirisch gemessen.
  - id: OMQ-003
    text: C5:2026 Detailmapping und weitere Framework-Versionen müssen weiter verfeinert werden.
  - id: OMQ-004
    text: Die noch nicht deterministisch operationalisierten natürlichen Anwendbarkeitsregeln der Question Bank müssen schrittweise strukturiert werden; bis dahin bleiben sie needs_review.

next_milestone:
  id: NEXT-112
  name: evidence-claim-hard-gate-integration
  github_issue: 15
  exit_criteria:
    - Alle acht Hard Gates sind in der Webanwendung sichtbar.
    - Gate-Ergebnisse sind auf Human-reviewed Claims, Evidence und deterministische Regeln zurückführbar.
    - Fehlende oder unzureichende Evidence bleibt UNVERIFIED.
    - Technisch unterschrittene Mindestanforderungen können deterministisch FAIL erzeugen.
    - PASS wird nur bei erfüllter technischer Anforderung und ausreichender Evidence erzeugt.
    - LLM-Vorschläge haben ohne Human Review keine Gate-Auswirkung.
