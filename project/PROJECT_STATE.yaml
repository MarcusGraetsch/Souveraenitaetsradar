quality_gates:
  provenance_required: true
  pr_review_for_substantial_changes: true
  deterministic_rule_tests_required: true
  raw_customer_evidence_in_repo: false
  automatic_risk_acceptance_allowed: false
  automatic_legal_decision_allowed: false
  customer_cloud_credentials_required: false
  llm_api_required_for_mvp: false
  llm_proposal_may_change_gate_without_human_review: false
  public_provider_capability_may_imply_applied_configuration: false
  provider_country_may_directly_set_sovereignty_score: false
  all_frameworks_must_run_for_every_assessment: false
  structured_enterprise_architecture_required: false
  unknown_applicability_may_be_hidden: false
  workflow_stage_may_replace_applicability: false
  needs_review_may_be_silently_hidden: false
  all_questions_audit_view_required: true
  gate_requirement_defaults_are_regulatory_requirements: false
  gate_requirement_override_requires_reason: true
  report_may_embed_raw_evidence_by_default: false
  structured_restore_may_overwrite_existing_assessment: false
  evidence_coverage_status_may_equal_gate_decision: false

open_method_questions:
  - id: OMQ-001
    text: Welche Änderungen ergeben sich aus dem vollständigen C3A-Volltext für Methodenkern v0.4, Provider Intelligence, Hard Gates und G-z.S-Taxonomie?
  - id: OMQ-002
    text: Der v0.4-Screeningkern mit etwa 15–25 Fragen muss an mindestens drei sehr unterschiedlichen Architekturvarianten kalibriert werden.
  - id: OMQ-003
    text: Die sieben sichtbaren Entscheidungsdimensionen müssen auf Trennschärfe, Vollständigkeit und Inter-Rater-Verständlichkeit geprüft werden.
  - id: OMQ-004
    text: Business-/Innovationsnutzen muss sichtbar sein, darf aber Hard Gates oder bewusst nicht akzeptierte Restrisiken nicht automatisch kompensieren; Darstellung und Gewichtung sind zu validieren.
  - id: OMQ-005
    text: Aktivierungsregeln für BSI-/C3A-/C5-/NIS2-/DORA-/Data-Act-/DSGVO-/KI-Deep-Dives und Compliance-Overlays müssen ohne erfundene Pflichten operationalisiert werden.
  - id: OMQ-006
    text: Inter-Rater-Konsistenz und interne Gate-/Requirement-Defaults müssen mit mehreren Beratern/Kundenfällen kalibriert werden.

open_security_questions:
  - id: OSQ-001
    text: Backup-ZIP-Import benötigt vor nicht vertrauenswürdiger Nutzung Limits für unkomprimierte Membergrößen, Gesamtgröße und Eintragsanzahl; siehe NEXT-117 / Issue #25.
  - id: OSQ-002
    text: Structured Restore soll vor nicht vertrauenswürdiger Nutzung vollständig serverseitig gegen das versionierte Export-Schema validieren; siehe Issue #26.

