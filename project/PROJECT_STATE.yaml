    - v0.4 Schema-/DB-/API-/UI-Migration
    - neue Providerbewertungen
    - Behauptung eines vollständigen C3A-Mappings
  allowed_while_waiting:
    - repository_hygiene
    - bugfixes
    - security_hardening
    - reine Quellensicherung ohne neue Methodenbehauptung

