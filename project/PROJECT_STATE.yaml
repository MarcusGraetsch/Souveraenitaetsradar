quality_gates:
  provenance_required: true
  pr_review_for_substantial_changes: true
  deterministic_rule_tests_required: true
  raw_customer_evidence_in_repo: false
  automatic_risk_acceptance_allowed: false
  customer_cloud_credentials_required: false
  llm_api_required_for_mvp: false
  uninstall_removes_generated_data: true
  unknown_applicability_may_be_hidden: false
  llm_proposal_may_change_gate_without_human_review: false
  gate_requirement_defaults_are_regulatory_requirements: false
  gate_requirement_override_requires_reason: true
  gate_requirement_change_audit_required: true
  synthetic_provider_assumptions_may_be_presented_as_provider_facts: false
  llm_may_decide_question_applicability: false
  workflow_stage_may_replace_applicability: false
  needs_review_may_be_silently_hidden: false
  all_questions_audit_view_required: true
  report_may_embed_raw_evidence_by_default: false
  structured_restore_may_overwrite_existing_assessment: false
  evidence_coverage_status_may_equal_gate_decision: false
  public_provider_capability_may_imply_applied_configuration: false
  provider_country_may_directly_set_sovereignty_score: false
  all_frameworks_must_run_for_every_assessment: false
  structured_enterprise_architecture_required: false

blockers: []

open_method_questions:
  - id: OMQ-001
    text: Default-Requirement-Templates und interne Schwellen müssen mit mehreren Beratern/Kundenfällen kalibriert werden.
  - id: OMQ-002
    text: Inter-Rater-Konsistenz der Fragen-/Gate-Bewertung ist noch nicht empirisch gemessen.
  - id: OMQ-003
    text: C5:2026 Detailmapping und weitere Framework-Versionen müssen weiter verfeinert werden.
  - id: OMQ-004
    text: Noch nicht deterministisch operationalisierte natürliche Anwendbarkeitsregeln bleiben needs_review und müssen schrittweise strukturiert werden.
  - id: OMQ-005
    text: Die interne Aggregation mehrerer Capability-Claims pro Gate muss im späteren Inter-Rater-/Kundenpilot kalibriert werden.
  - id: OMQ-006
    text: Der progressive Fragenworkflow muss priorisieren, ohne komplexe Workloads durch stilles Wegfiltern methodisch zu verengen.
  - id: OMQ-007
    text: Die einfache MVP-Regel Basis/Scope→Screening und sonst applicable→Deep Dive muss nach realen Consultant-Durchläufen weiter kalibriert werden.
  - id: OMQ-008
    text: Die aktuelle work_queue fasst Screening und Clarification zusammen und differenziert einfache vs. komplexe Workloads noch nicht ausreichend; NEXT-116 / Issue #22 adressiert das.
  - id: OMQ-009
    text: Evidence-Request-Coverage und Hard-Gate-Auswertung sind bewusst getrennt; reale Piloten müssen zeigen, ob zusätzliche deterministische Coverage-Holds pro Gate benötigt werden.
  - id: OMQ-010
    text: Der v0.4-Screeningkern mit etwa 15–25 Fragen muss an mindestens drei sehr unterschiedlichen Entscheidungsfällen kalibriert werden.
  - id: OMQ-011
    text: Business-/Innovationsnutzen muss sichtbar sein, darf aber nicht automatisch nicht kompensierbare rechtliche, Security- oder Kundenanforderungen überstimmen; Darstellungs- und Gewichtungslogik ist zu validieren.
  - id: OMQ-012
    text: Aktivierungsregeln für BSI-/C3A-/C5-/NIS2-/DORA-/Data-Act-/DSGVO-/KI-Deep-Dives und Compliance-Overlays müssen so definiert werden, dass sie weder Pflichten erfinden noch relevante Anforderungen übersehen.
  - id: OMQ-013
    text: Die sieben sichtbaren Entscheidungsdimensionen müssen auf Trennschärfe, Vollständigkeit und Inter-Rater-Verständlichkeit geprüft werden.

open_security_questions:
  - id: OSQ-001
    text: Backup-ZIP-Import benötigt vor nicht vertrauenswürdiger Nutzung Vorablimits für unkomprimierte Membergrößen, Gesamtgröße und Eintragsanzahl; siehe NEXT-117 / Issue #25.
  - id: OSQ-002
    text: Structured Restore soll vor nicht vertrauenswürdiger Nutzung vollständig serverseitig gegen das versionierte Export-Schema validieren; siehe Issue #26.

next_milestone:
  id: NEXT-118
  name: first-manual-consultant-install-evaluation
  priority: P0
  status: ready
  github_issue: 28
  intent: >-
    Die technisch grüne Installation und den synthetischen Evidence-Pilot erstmals aus echter
    Beraterperspektive manuell bedienen und fachlich/UX-seitig evaluieren. Dabei soll zusätzlich
    geprüft werden, welche Teile der bisherigen UI den v0.4-Decision-Support-Kern unnötig sichtbar
    machen oder die Beratungsoberfläche überladen.
  exit_criteria:
    - Installation auf dem Zielsystem ist erfolgreich oder ein reproduzierbarer Blocker dokumentiert.
    - Mindestens ein manueller synthetischer End-to-End-Fall wurde durchgeführt.
    - Evidence, Claims, Requirements und Gate-Ergebnisse wurden aus Beratersicht auf Verständlichkeit geprüft.
    - Export, Report, Backup und Restore wurden manuell ausprobiert.
    - Methodik- und UX-Findings sind als Issues/Decisions dokumentiert.
    - Die Abweichungen zwischen aktueller MVP-Oberfläche und Methodenkern v0.4 sind dokumentiert.
    - Danach ist die Priorisierung zwischen NEXT-116, v0.4-Referenzfallvalidierung, Security-Hardening und erstem realen Customer-mediated Pilot entschieden.
