open_method_questions:
  - id: OMQ-002
    text: Der v0.4-Screeningkern mit etwa 15–25 Fragen muss an mindestens drei sehr unterschiedlichen Architekturvarianten kalibriert werden.
  - id: OMQ-003
    text: Die sieben sichtbaren Entscheidungsdimensionen müssen auf Trennschärfe, Vollständigkeit und Inter-Rater-Verständlichkeit geprüft werden.
  - id: OMQ-004
    text: Business-/Innovationsnutzen muss sichtbar sein, darf aber Hard Gates oder bewusst nicht akzeptierte Restrisiken nicht automatisch kompensieren; Darstellung und Gewichtung sind zu validieren.
  - id: OMQ-005
    text: Aktivierungsregeln für BSI-/C3A-/C5-/NIS2-/DORA-/Data-Act-/DSGVO-/KI-Deep-Dives und Compliance-Overlays müssen ohne erfundene Pflichten operationalisiert werden.
  - id: OMQ-006
    text: Inter-Rater-Konsistenz und interne Gate-/Requirement-Defaults müssen mit mehreren Beratern/Kundenfällen kalibriert werden.
  - id: OMQ-007
    text: Die im C3A-Crosswalk verbleibenden partial/gap-Einträge sollen nur dann in zusätzliche Deep-Dive-Fragen überführt werden, wenn das Requirement Profile sie aktiviert oder sie die Variantenentscheidung materiell beeinflussen.

open_security_questions:
  - id: OSQ-001
    text: Backup-ZIP-Import benötigt vor nicht vertrauenswürdiger Nutzung Limits für unkomprimierte Membergrößen, Gesamtgröße und Eintragsanzahl; siehe NEXT-117 / Issue #25.
  - id: OSQ-002
    text: Structured Restore soll vor nicht vertrauenswürdiger Nutzung vollständig serverseitig gegen das versionierte Export-Schema validieren; siehe Issue #26.

