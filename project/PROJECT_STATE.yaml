    Der vollständige BSI-C3A-Kriterienkatalog soll vom Projektinhaber bereitgestellt
    und anschließend gegen Methodenkern v0.4, Provider Intelligence, Hard Gates,
    Risikotaxonomie und Question Library geprüft werden.
