project:
  name: Souveraenitaetsradar
  repository: MarcusGraetsch/Souveraenitaetsradar
  status: active
  current_phase: MVP-VALIDATION
  current_phase_name: first-manual-consultant-evaluation
  method_version: "1.0"
  method_design_revision: "v0.4-decision-support-draft"
  product_version: "0.4.0-dev"
  updated: "2026-09-08"

purpose:
  statement: >-
    Entwicklung einer belastbaren, nachvollziehbaren und später KI-gestützten
    Methode sowie eines praktisch nutzbaren Beratungswerkzeugs zur vergleichenden
    Bewertung digitaler Souveränität, Risiken, Chancen und Handlungsfähigkeit von
    Cloud-, Plattform-, SaaS-, KI- und On-Prem-Betriebsvarianten.

current_truth:
  - Der Methodenkern ist cloud-agnostisch; Provider-spezifische Logik ist Adapter-/Research-Layer.
  - "Methodenkern v0.4 ist als Decision-Support-Entwurf dokumentiert: Ziel ist eine belastbare Entscheidungsvorlage für mehrere Betriebs-/Architekturvarianten eines konkreten Workloads, kein universelles Compliance-Audit."
  - "Die sichtbare Managementsicht nutzt sieben Entscheidungsdimensionen: Geschäft & Innovation, Security & Resilienz, Recht/Daten/Kontrolle, Technologie & Exit, Organisation & Skills, Lieferkette & Geopolitik sowie Wirtschaft & Vertrag; Evidence Confidence bleibt separat."
  - "BSI 200-3 bleibt Anschluss-, Deep-Dive- und Vollständigkeitsreferenz für Scope, Zielobjekte, Gefährdungen, Risikoappetit und Risikobehandlung; die 47 elementaren Gefährdungen sind kein verpflichtender sichtbarer Interviewkatalog."
  - "Bitkom Cloud-Souveränität 2026 ist zentrale Orientierungsquelle für Handlungsfähigkeit, Risiko/Chance, Skills, Interdependenzen und Exit; EU-CSF/C3A bilden primär den Provider-/Service-Souveränitätslayer."
  - "Data Act wird als allgemeine Exit-/Switching-/Portabilitätsreferenz genutzt; NIS2, DORA, DSGVO/EDPB, AI Act und andere Vorgaben werden nur bei tatsächlicher Anwendbarkeit als Compliance-Overlay aktiviert und sonst höchstens als Methoden-/Fragenquelle verwendet."
  - "Die vorhandene Fragenbank ist eine adaptive Question Library, kein Standardfragebogen; Ziel für den sichtbaren Einstieg sind etwa 15–25 Screening-Fragen mit Vertiefung nur bei Entscheidungsrelevanz, Mindestkriterien, wesentlichen Risiken/Vorteilen oder Evidence Gaps."
  - "Eine realistische Status-quo-/Nichtstun-Variante wird bei Migrations-/Modernisierungsentscheidungen mitbetrachtet; Business-/Innovationsnutzen und Risiko des Nichtstuns sind expliziter Entscheidungsinput."
  - "Vorhandene Kundenartefakte und Interviews bilden einen kombinierten Intake: Servicekatalog/CMDB, ArchiMate/EA, Diagramme, BIA/BCM, ISMS, Verträge, IaC, Kubernetes/GitOps, IAM/PKI/KMS, FinOps und Tests sind optionale Quellen, nie Voraussetzung."
  - "ArchiMate kann über standardisierte Austauschformate oder dokumentierte Tool-Adapter genutzt werden; ein generisches ArchiMate-YAML wird nicht vorausgesetzt."
  - "Politische/geopolitische Sorgen werden in konkrete prüfbare Szenarien wie compelled access, Sanktionen/Exportkontrollen, Serviceentzug, Supportverlust, Change of Control oder Preis-/Vertragsänderungen übersetzt; Herkunft allein ist kein Provider-Score."
  - Direkter Cloud-Account-, Root-, Owner- oder Credential-Zugang ist keine Voraussetzung des Beratungsprodukts.
  - "Standard ist Customer-mediated Evidence: Kunde liefert Dokumente, Exporte, Screenshare-Beobachtungen oder Testergebnisse."
  - Security Capability, Sovereignty Capability, Workload Sovereignty Risk und Evidence Confidence bleiben getrennt.
  - Gate first, score second; nicht kompensierbare Mindestanforderungen werden zuerst geprüft.
  - Provider/Service Capability wird von Applied Capability getrennt.
  - Fehlende Evidence führt zu UNVERIFIED/EVIDENCE HOLD, nicht zu erfundenem PASS/FAIL.
  - Die Excel-Datei ist Methoden-/Entwicklungsreferenz, nicht primäre Consultant-UI.
  - MVP-01 ist eine lokal installierbare React/FastAPI/PostgreSQL-Webanwendung mit lokalem Dokument-Speicher.
  - KI-Unterstützung im MVP erfolgt über eine Copy/Paste LLM Bridge ohne API-Key oder Providerbindung.
  - Question Applicability nutzt applicable, not_applicable und needs_review; Unklarheit blendet keine Frage still aus.
  - Evidence wird vor Gate-Nutzung mit Applied State, Trust-Dimensionen und Review Status bewertet.
  - Human-reviewed Claims sind die einzige Brücke von Evidence zur deterministischen Gate-Bewertung.
  - "Gate-Aggregation ist konservativ: schwächste bestätigte Capability begrenzt das Gate; unzureichende Evidence bleibt UNVERIFIED."
  - Gate-Requirements werden aus internen Kritikalitäts-Templates vorbelegt; eine Abweichung ist nur als begründeter Consultant-Override mit Auditspur zulässig und die Rückkehr zum Standard erfolgt explizit per Reset.
  - Die fachlichen Beschreibungen der internen Gate-Stufen 0-4 stammen pro Gate aus der Methodenbank; die Skala ist keine externe BSI-/EU-/Gesetzesskala.
  - LLM-Proposals verändern ohne Human Review weder Claims noch Hard Gates.
  - Applicability und Workflow-Priorisierung sind getrennte Zustände; Workflow Stage ersetzt keine fachliche Applicability.
  - "NEXT-115 Stufen: screening, clarification, deep_dive, completed, excluded."
  - needs_review wird vollständig in einer sichtbaren clarification-Queue geführt und niemals still ausgeblendet.
  - answered questions wechseln in completed und bleiben in der All-Questions-/Audit-Ansicht sichtbar.
  - deterministisch not_applicable Fragen liegen in excluded und bleiben vollständig inspizierbar.
  - "NEXT-116 / Issue #22 adressiert die noch zu große unmittelbare work_queue und bleibt P1; die v0.4-Methodik liefert dafür die fachliche Zielrichtung einer deutlich kleineren Screening-Oberfläche."
  - "NEXT-113 ist auf main: Structured Export, Consultant Report, strukturierte/full Backups, Restore und Gate-Semantikvergleich sind implementiert und validiert."
  - "NEXT-113 Merge-Gate Run 33834276156 ist vollständig grün; Artifact 9922749183."
  - "Standardexport und Consultant Report enthalten keine sensitiven Evidence-Inhalte; Full Backup ist explizites Opt-in."
  - "Restore erzeugt immer ein neues Assessment, remappt Referenzen und berechnet Gates neu."
  - "NEXT-101 ist implementiert und validiert: providerneutrales Customer Evidence Pack ohne Cloud-Credentials, explizites Mapping auf Evidence Requests und konservative Coverage-Analyse."
  - "NEXT-101 Coverage-Baseline: 5 Evidence-Klassen, 11 erforderliche Requests, 3 VERIFIED, 4 REVIEW_REQUIRED, 1 INSUFFICIENT, 3 MISSING."
  - "NEXT-101 Live-Webapp-Pilot: nur ein explizit human-reviewed synthetischer Claim wirkt auf Hard Gates; HG-01 PASS, HG-02 bis HG-08 UNVERIFIED."
  - "Öffentliche Provider-Dokumentation mit applied_state=available wird nicht als configured Applied Capability behandelt."
  - "NEXT-101 CI Run 33837372041 vollständig grün; Artifact 9923731562; Python, Frontend, Compose, Live-Webapp-Pilot und kompletter Lifecycle bestanden."
  - "Der erste reale Mensch-im-Loop-Nutzertest ist NEXT-118 / Issue #28; Runbook: docs/validation/FIRST_INSTALL_EVALUATION.md."
  - "Issue #67 dokumentiert die v0.4-Neufokussierung; vor Runtime-Umbauten soll die Methodik an Referenzfällen validiert werden."
  - "Security-Hardening-Finding NEXT-117 / Issue #25: ZIP-Import benötigt vor untrusted Nutzung Limits für unkomprimierte Member-/Gesamtgrößen und Entry Count."
  - "Issue #26: Structured Restore soll vor untrusted Nutzung serverseitig vollständig gegen das versionierte Export-Schema validieren."
  - LLM darf weder Applicability noch Workflow Stage deterministisch entscheiden.
  - Der frühere direkte AWS-Collector ist als Standardansatz verworfen und nur historisch dokumentiert.

