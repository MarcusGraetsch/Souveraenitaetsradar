project:
  name: Souveraenitaetsradar
  repository: MarcusGraetsch/Souveraenitaetsradar
  status: active
  current_phase: MVP-01C
  current_phase_name: progressive-guided-workflow
  method_version: "1.0"
  product_version: "0.3.0-dev"
  updated: "2026-09-03"

purpose:
  statement: >-
    Entwicklung einer belastbaren, nachvollziehbaren und später KI-gestützten
    Methode sowie eines praktisch nutzbaren Beratungswerkzeugs zur Bewertung
    digitaler Souveränitätsrisiken von Cloud-, Plattform-, SaaS- und KI-Lösungen.

current_truth:
  - Der Methodenkern ist cloud-agnostisch; Provider-spezifische Logik ist Adapter-/Research-Layer.
  - Direkter Cloud-Account-, Root-, Owner- oder Credential-Zugang ist keine Voraussetzung des Beratungsprodukts.
  - "Standard ist Customer-mediated Evidence: Kunde liefert Dokumente, Exporte, Screenshare-Beobachtungen oder Testergebnisse."
  - Security Capability, Sovereignty Capability, Workload Sovereignty Risk und Evidence Confidence bleiben getrennt.
  - Gate first, score second; nicht kompensierbare Mindestanforderungen werden zuerst geprüft.
  - Provider/Service Capability wird von Applied Capability getrennt.
  - Fehlende Evidence führt zu UNVERIFIED/EVIDENCE HOLD, nicht zu erfundenem PASS/FAIL.
  - Die Excel-Datei ist Methoden-/Entwicklungsreferenz, nicht primäre Consultant-UI.
  - MVP-01 ist eine lokal installierbare React/FastAPI/PostgreSQL-Webanwendung mit lokalem Dokument-Speicher.
  - KI-Unterstützung im MVP erfolgt über eine Copy/Paste LLM Bridge ohne API-Key oder Providerbindung.
  - Question Applicability nutzt applicable, not_applicable und needs_review; Unklarheit blendet keine Frage still aus.
  - NEXT-102 Evidence Intake und NEXT-103 providerneutrales Gate/Evidence-Request-Mapping sind abgeschlossen.
  - "NEXT-112 ist implementiert und auf main: Evidence Review, Human-reviewed Claims, Gate Requirements und alle acht Hard Gates sind in API und Consultant-UI integriert."
  - "NEXT-112 Merge-SHA: 85caf27f091ed728585c1db969eb325695f7e1db."
  - Evidence wird vor Gate-Nutzung mit Applied State, Trust-Dimensionen und Review Status bewertet.
  - Human-reviewed Claims sind die einzige Brücke von Evidence zur deterministischen Gate-Bewertung.
  - "Gate-Aggregation ist konservativ: schwächste bestätigte Capability begrenzt das Gate; unzureichende Evidence bleibt UNVERIFIED."
  - Gate-Requirements werden aus internen Kritikalitäts-Templates vorbelegt und bleiben pro Gate als Consultant-Override editierbar.
  - LLM-Proposals verändern ohne Human Review weder Claims noch Hard Gates.
  - "NEXT-114 ist erfolgreich validiert: GitHub Actions Run 33789278423 war für python, frontend, compose-smoke und consultant-walkthrough vollständig grün."
  - "NEXT-114 reproduzierte im laufenden Produkt HG-01 PASS, HG-03 FAIL und HG-04 UNVERIFIED; der LLM-Import änderte weder Claim-Anzahl noch Gate States."
  - "NEXT-114 validierte Clean Checkout, install.sh, stop.sh, start.sh, test.sh und vollständige Deinstallation; Artifact-ID 9906680972 enthält den maschinenlesbaren Report."
  - Der synthetische NEXT-114-Fall ist providerneutral; alle technischen/vertraglichen Merkmale sind ausdrücklich Testannahmen und keine Providerfakten.
  - "Wichtigstes NEXT-114-Finding: beim breit gescopten KI-Agenten lagen 124 von 128 Fragen im Standardpfad, davon 83 applicable und 41 needs_review."
  - NEXT-115 / Issue #20 ist deshalb der nächste P0-Schritt und soll den Workflow deterministisch in Screening, Klärung und Deep Dive stufen, ohne needs_review zu verstecken.
  - Der frühere direkte AWS-Collector ist als Standardansatz verworfen und nur historisch dokumentiert.

