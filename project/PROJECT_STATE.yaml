quality_gates:
  provenance_required: true
  pr_review_for_substantial_changes: true
  deterministic_rule_tests_required: true
  raw_customer_evidence_in_repo: false
  automatic_risk_acceptance_allowed: false
  customer_cloud_credentials_required: false
  llm_api_required_for_mvp: false
  uninstall_removes_generated_data: true
  unknown_applicability_may_be_hidden: false
  llm_proposal_may_change_gate_without_human_review: false
  gate_requirement_defaults_are_regulatory_requirements: false
  synthetic_provider_assumptions_may_be_presented_as_provider_facts: false
  llm_may_decide_question_applicability: false

blockers: []

open_method_questions:
  - id: OMQ-001
    text: Default-Requirement-Templates und interne Schwellen müssen mit mehreren Beratern/Kundenfällen kalibriert werden.
  - id: OMQ-002
    text: Inter-Rater-Konsistenz der Fragen-/Gate-Bewertung ist noch nicht empirisch gemessen.
  - id: OMQ-003
    text: C5:2026 Detailmapping und weitere Framework-Versionen müssen weiter verfeinert werden.
  - id: OMQ-004
    text: Noch nicht deterministisch operationalisierte natürliche Anwendbarkeitsregeln bleiben needs_review und müssen schrittweise strukturiert werden.
  - id: OMQ-005
    text: Die interne Aggregation mehrerer Capability-Claims pro Gate muss im späteren Inter-Rater-/Kundenpilot kalibriert werden.
  - id: OMQ-006
    text: Der progressive Fragenworkflow muss priorisieren, ohne komplexe Workloads durch stilles Wegfiltern methodisch zu verengen.

next_milestone:
  id: NEXT-115
  name: progressive-guided-workflow
  github_issue: 20
  baseline: "NEXT-114: komplexer KI-Agent 124/128 im Standardpfad; 83 applicable, 41 needs_review."
  exit_criteria:
    - Der Consultant sieht zuerst eine priorisierte Screening-/Arbeitsqueue statt fast aller Fragen gleichzeitig.
    - needs_review bleibt in einer sichtbaren Klärungsqueue.
    - Deep-Dive-Fragen werden deterministisch durch Scope, Answers, Evidence Gaps oder Gate State aktiviert.
    - Alle Fragen bleiben jederzeit inspizierbar.
    - LLM entscheidet nicht über Applicability oder Workflow-Stufe.
    - Ein einfacher Workload bleibt deutlich kürzer als der komplexe KI-Agent-Fall.
