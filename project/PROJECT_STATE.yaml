next_milestone:
  id: NEXT-120
  name: c3a-fulltext-method-review
  priority: P0
  status: waiting_input
  github_issue: 68
  intent: >-
    Den vollständigen C3A-Kriterienkatalog gegen den Decision-Support-Methodenkern v0.4
    und die bestehende Architektur prüfen, notwendige Änderungen nachvollziehbar ableiten
    und erst danach die weitere Methodenvalidierung bzw. Runtime-Migration freigeben.
  exit_criteria:
    - C3A-Volltext und Version sind im Source Register/Fundstellenmodell eindeutig erfasst.
    - C3A-Kriterien sind gegen Provider Intelligence, Decision Dimensions, Hard Gates und G-z.S-Risiken geprüft.
    - Direkte C3A-Aussagen, externe Ableitungen und interne Methodik bleiben getrennt gekennzeichnet.
    - Notwendige Methodendokument-/Glossar-/Decision-Änderungen sind umgesetzt oder als Folge-Issues erfasst.
    - NEXT-118/NEXT-119 und spätere Runtime-Migration sind danach explizit freigegeben oder angepasst.
