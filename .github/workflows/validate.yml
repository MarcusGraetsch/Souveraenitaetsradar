name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e . -r requirements-dev.txt -r apps/api/requirements.txt
      - run: python tools/validate_repo.py
      - run: python -m pytest -q
      - run: python -m pytest -q apps/api/tests
      - run: python -m py_compile tools/evidence-pack/validate_evidence_pack.py src/sovradar/*.py apps/api/app/*.py
      - run: python tools/evidence-pack/validate_evidence_pack.py data/templates/evidence-pack-example

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - working-directory: apps/web
        run: npm install --no-audit --no-fund
      - working-directory: apps/web
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: mkdir -p .runtime/documents .runtime/exports .runtime/temp
      - run: docker compose config >/dev/null
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for API and Web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              health = json.load(f)
          assert health['status'] == 'ok', health
          assert health['method_questions'] >= 100, health
          print(health)
          PY
          curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans --rmi local
