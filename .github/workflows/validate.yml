name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python tools/validate_repo.py
      - run: python -m pytest -q
      - name: Check shell syntax
        run: bash -n tools/aws-bedrock-evidence/sovradar_aws_evidence_collect.sh
      - name: Compile Python tools
        run: python -m py_compile tools/aws-bedrock-evidence/r6_normalize_evidence.py src/sovradar/*.py
