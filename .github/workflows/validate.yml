name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e . -r requirements-dev.txt -r apps/api/requirements.txt
      - run: python tools/validate_repo.py
      - run: python -m pytest -q
      - run: python -m pytest -q apps/api/tests
      - run: python -m py_compile tools/evidence-pack/validate_evidence_pack.py tools/validation/synthetic_consultant_walkthrough.py tools/validation/progressive_workflow_validation.py tools/validation/export_restore_validation.py tools/validation/customer_evidence_pack_pilot.py tools/validation/customer_evidence_pack_webapp.py src/sovradar/*.py apps/api/app/*.py
      - run: python tools/evidence-pack/validate_evidence_pack.py data/templates/evidence-pack-example
      - name: Validate NEXT-101 Evidence Pack coverage baseline
        run: python tools/validation/customer_evidence_pack_pilot.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - working-directory: apps/web
        run: npm install --no-audit --no-fund
      - working-directory: apps/web
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: mkdir -p .runtime/documents .runtime/exports .runtime/temp
      - run: docker compose config >/dev/null
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for API and Web
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              health = json.load(f)
          assert health['status'] == 'ok', health
          assert health['method_questions'] >= 100, health
          print(health)
          PY
          curl -fsS http://127.0.0.1:8080/ >/dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans --rmi local

  consultant-walkthrough:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from clean checkout
        run: printf '\n\n' | ./install.sh
      - name: Run synthetic consultant walkthrough
        run: |
          python3 tools/validation/synthetic_consultant_walkthrough.py \
            --base-url http://127.0.0.1:8080 \
            --output .runtime/exports/synthetic-consultant-walkthrough.json
          cp .runtime/exports/synthetic-consultant-walkthrough.json /tmp/sovradar-synthetic-walkthrough.json
      - name: Validate progressive guided workflow
        run: |
          python3 tools/validation/progressive_workflow_validation.py \
            --base-url http://127.0.0.1:8080 \
            --output .runtime/exports/progressive-workflow-validation.json
          cp .runtime/exports/progressive-workflow-validation.json /tmp/sovradar-progressive-workflow.json
      - name: Validate export restore and Consultant Report
        run: |
          python3 tools/validation/export_restore_validation.py \
            --base-url http://127.0.0.1:8080 \
            --output .runtime/exports/export-restore-validation.json
          cp .runtime/exports/export-restore-validation.json /tmp/sovradar-export-restore.json
      - name: Run NEXT-101 Customer Evidence Pack through Webapp API
        run: |
          python3 tools/validation/customer_evidence_pack_webapp.py \
            --base-url http://127.0.0.1:8080 \
            --output .runtime/exports/next-101-webapp-pilot.json
          cp .runtime/exports/next-101-webapp-pilot.json /tmp/sovradar-next-101-webapp.json
      - name: Validate stop and restart
        run: |
          ./stop.sh
          ./start.sh
          ./test.sh
      - name: Validate complete uninstall
        run: |
          set +e
          printf 'DELETE\nn\n' | ./uninstall.sh
          uninstall_rc=$?
          set -e
          echo "uninstall exit code: ${uninstall_rc}"
          if [[ -e .runtime ]]; then
            echo '.runtime still exists after uninstall' >&2
            ls -lad .runtime >&2 || true
            find .runtime -maxdepth 3 -ls >&2 || true
            exit 1
          fi
          if [[ -e .env ]]; then
            echo '.env still exists after uninstall' >&2
            ls -l .env >&2 || true
            exit 1
          fi
          if docker ps -a --format '{{.Names}}' | grep -Eqi 'souveraenitaetsradar|sovradar'; then
            echo 'Souveraenitaets-Radar container remained after uninstall' >&2
            docker ps -a
            exit 1
          fi
          if [[ ${uninstall_rc} -ne 0 ]]; then
            echo "uninstall.sh returned ${uninstall_rc} despite removing all generated resources" >&2
            exit 1
          fi
          echo 'complete uninstall validation passed'
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consultant-validation-reports
          path: |
            /tmp/sovradar-synthetic-walkthrough.json
            /tmp/sovradar-progressive-workflow.json
            /tmp/sovradar-export-restore.json
            /tmp/sovradar-next-101-webapp.json
          if-no-files-found: warn
      - name: Logs on failure
        if: failure()
        run: |
          if [[ -f .env ]]; then
            docker compose logs --no-color || true
          else
            docker ps -a || true
          fi
      - name: Emergency cleanup
        if: always()
        run: |
          if [[ -f .env ]]; then
            docker compose down -v --remove-orphans --rmi local || true
          fi
